  #  ports:
  #    - "6379:6379"
    # volumes:
    #   - redis_data:/data
    # networks:
    #   - crushd_network
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  crushd_network:
    driver: bridge